<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaad's 1st Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFFDF8;
    --yellow:#F3D06B;
    --yellow-light:#FBEFC7;
    --peach:#F4B9A0;
    --peach-dark:#DB8A6B;
    --mint:#BFE3D0;
    --lilac:#D8C6EE;
    --pink:#F6C9C9;
    --ink:#4A4340;
    --ink-soft:#8A7F6F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Quicksand',sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  .bg-pattern{
    position:fixed;
    inset:0;
    background-image:
      repeating-linear-gradient(45deg, var(--yellow-light) 0 40px, transparent 40px 80px);
    opacity:.35;
    z-index:0;
    pointer-events:none;
  }
  .confetti{
    position:fixed;
    top:-20px;
    z-index:1;
    pointer-events:none;
    border-radius:50%;
    animation:fall linear infinite;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(300deg); }
  }
  .balloon{
    position:fixed;
    bottom:-120px;
    z-index:1;
    pointer-events:none;
    animation:rise linear infinite;
    opacity:.85;
  }
  @keyframes rise{
    to{ transform:translateY(-120vh); }
  }
  .wrap{
    position:relative;
    z-index:2;
    max-width:480px;
    margin:0 auto;
    padding:2.5rem 1.5rem 4rem;
  }
  .card{
    background:var(--cream);
    border:2px solid var(--yellow);
    border-radius:28px;
    padding:2.5rem 1.75rem;
    text-align:center;
    box-shadow:0 10px 30px rgba(219,138,107,.12);
  }
  .eyebrow{
    font-size:.8rem;
    letter-spacing:.12em;
    color:var(--ink-soft);
    font-weight:600;
    margin:0 0 .25rem;
  }
  .name{
    font-family:'Caveat',cursive;
    font-size:4rem;
    line-height:1;
    margin:0;
    color:var(--peach-dark);
    font-weight:700;
  }
  .subtitle{
    font-size:1.05rem;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--ink);
    margin:.6rem 0 1.75rem;
  }
  .divider{
    width:60px;
    height:3px;
    background:var(--mint);
    border-radius:3px;
    margin:0 auto 1.75rem;
  }
  .detail-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.6rem;
    font-size:1.05rem;
    margin:.55rem 0;
    color:var(--ink);
  }
  .detail-row .ic{
    font-size:1.15rem;
  }
  .venue{
    font-weight:700;
  }
  .countdown{
    display:flex;
    justify-content:center;
    gap:.6rem;
    margin:2rem 0 1.75rem;
  }
  .cbox{
    background:var(--yellow-light);
    border-radius:14px;
    padding:.7rem .5rem;
    min-width:60px;
  }
  .cbox .num{
    font-size:1.5rem;
    font-weight:700;
    color:var(--peach-dark);
    font-variant-numeric:tabular-nums;
  }
  .cbox .lbl{
    font-size:.65rem;
    letter-spacing:.08em;
    color:var(--ink-soft);
    font-weight:600;
    text-transform:uppercase;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:.5rem;
    width:100%;
    padding:.95rem 1.5rem;
    border-radius:999px;
    border:none;
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    text-decoration:none;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{
    background:var(--peach);
    color:#fff;
    box-shadow:0 6px 16px rgba(219,138,107,.35);
    margin-bottom:.75rem;
  }
  .btn-primary:hover{ box-shadow:0 8px 20px rgba(219,138,107,.45); }
  .btn-secondary{
    background:var(--mint);
    color:#1f4b38;
    box-shadow:0 6px 16px rgba(31,75,56,.15);
  }
  .btn-secondary.rsvped{
    background:var(--lilac);
    color:#3c2f5c;
  }
  .rsvp-msg{
    font-size:.9rem;
    color:var(--ink-soft);
    margin-top:.9rem;
    min-height:1.2em;
  }
  .rsvp-form{
    display:none;
    flex-direction:column;
    gap:.6rem;
    margin-bottom:.75rem;
  }
  .rsvp-form.open{
    display:flex;
  }
  .rsvp-form input{
    font-family:'Quicksand',sans-serif;
    font-size:1rem;
    padding:.7rem .9rem;
    border-radius:14px;
    border:1.5px solid var(--yellow);
    background:var(--yellow-light);
    color:var(--ink);
    outline:none;
    width:100%;
  }
  .rsvp-form input::placeholder{ color:var(--ink-soft); }
  .rsvp-form input:focus{ border-color:var(--peach-dark); }
  .rsvp-error{
    font-size:.82rem;
    color:#b3492f;
    display:none;
    margin:-.2rem 0 0;
    text-align:left;
    padding-left:.3rem;
  }
  .card{ position:relative; }
  .deco{
    position:absolute;
    pointer-events:none;
  }
  .deco.tl{ top:-14px; left:-10px; }
  .deco.tr{ top:-16px; right:-8px; }
  .deco.bl{ bottom:-10px; left:-12px; }
  .deco.br{ bottom:-12px; right:-10px; transform:rotate(15deg); }
  .icon-row{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:1.3rem;
    height:1.3rem;
    flex-shrink:0;
  }
  .footnote{
    text-align:center;
    font-size:.8rem;
    color:var(--ink-soft);
    margin-top:1.5rem;
  }
</style>
</head>
<body>

<div class="bg-pattern" aria-hidden="true"></div>
<div id="fx-layer" aria-hidden="true"></div>

<div class="wrap">
  <div class="card">
    <svg class="deco tl" width="30" height="30" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="12" r="7" fill="#F6C9C9"/><circle cx="28" cy="20" r="7" fill="#BFE3D0"/>
      <circle cx="20" cy="28" r="7" fill="#D8C6EE"/><circle cx="12" cy="20" r="7" fill="#F3D06B"/>
      <circle cx="20" cy="20" r="6" fill="#F4B9A0"/>
    </svg>
    <svg class="deco tr" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2 L14.5 9 L22 9.5 L16 14.5 L18 22 L12 17.5 L6 22 L8 14.5 L2 9.5 L9.5 9 Z" fill="#F3D06B"/>
    </svg>
    <svg class="deco bl" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2 L14.5 9 L22 9.5 L16 14.5 L18 22 L12 17.5 L6 22 L8 14.5 L2 9.5 L9.5 9 Z" fill="#BFE3D0"/>
    </svg>
    <svg class="deco br" width="26" height="26" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="12" r="7" fill="#D8C6EE"/><circle cx="28" cy="20" r="7" fill="#F6C9C9"/>
      <circle cx="20" cy="28" r="7" fill="#BFE3D0"/><circle cx="12" cy="20" r="7" fill="#F4B9A0"/>
      <circle cx="20" cy="20" r="6" fill="#F3D06B"/>
    </svg>

    <p class="eyebrow">YOU ARE INVITED TO JOIN US FOR</p>
    <p class="name">Zaad's</p>
    <p class="subtitle">1ST BIRTHDAY CELEBRATION</p>
    <div class="divider"></div>

    <div class="detail-row">
      <span class="icon-row"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="4" fill="#F6C9C9"/><rect x="3" y="5" width="18" height="5" rx="4" fill="#DB8A6B"/><circle cx="8" cy="3.5" r="1.4" fill="#DB8A6B"/><circle cx="16" cy="3.5" r="1.4" fill="#DB8A6B"/><circle cx="8" cy="14" r="1.4" fill="#DB8A6B"/><circle cx="14" cy="14" r="1.4" fill="#DB8A6B"/></svg></span>
      <span>Sunday, 20 September</span>
    </div>
    <div class="detail-row">
      <span class="icon-row"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#BFE3D0"/><path d="M12 7 v5 l4 2" stroke="#1f4b38" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>4 PM – 7 PM</span>
    </div>
    <div class="detail-row">
      <span class="icon-row"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2 C7 2 4 5.5 4 10 C4 15 12 22 12 22 C12 22 20 15 20 10 C20 5.5 17 2 12 2 Z" fill="#F4B9A0"/><circle cx="12" cy="10" r="3.2" fill="#fff"/></svg></span>
      <span class="venue">Randini Reception Hall</span>
    </div>

    <div class="countdown" id="countdown">
      <div class="cbox"><div class="num" id="cd-d">00</div><div class="lbl">Days</div></div>
      <div class="cbox"><div class="num" id="cd-h">00</div><div class="lbl">Hrs</div></div>
      <div class="cbox"><div class="num" id="cd-m">00</div><div class="lbl">Min</div></div>
      <div class="cbox"><div class="num" id="cd-s">00</div><div class="lbl">Sec</div></div>
    </div>

    <a class="btn btn-primary" href="https://maps.google.com/?cid=10508915421869343428" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2 C7 2 4 5.5 4 10 C4 15 12 22 12 22 C12 22 20 15 20 10 C20 5.5 17 2 12 2 Z" fill="#fff"/><circle cx="12" cy="10" r="3.2" fill="#F4B9A0"/></svg>
      Get directions
    </a>
    <button class="btn btn-secondary" id="rsvp-btn" onclick="openRsvpForm()">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><ellipse cx="12" cy="9" rx="7" ry="8.5" fill="#1f4b38"/><path d="M12 17 L10.5 20 L13.5 20 Z" fill="#1f4b38"/></svg>
      I'll be there!
    </button>

    <div class="rsvp-form" id="rsvp-form">
      <input type="text" id="rsvp-name" placeholder="Your name" />
      <p class="rsvp-error" id="rsvp-error">Enter your name first</p>
      <input type="number" id="rsvp-guests" min="1" value="1" placeholder="Number of guests" />
      <button class="btn btn-primary" style="margin-bottom:0;" onclick="submitRsvp()">
        Confirm RSVP
      </button>
    </div>

    <p class="rsvp-msg" id="rsvp-msg"></p>
  </div>
  <p class="footnote">Can't wait to celebrate with you <svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px" aria-hidden="true"><path d="M12 21 C12 21 3 14.5 3 8.5 C3 5.5 5.5 3.5 8 3.5 C10 3.5 11.5 4.5 12 6 C12.5 4.5 14 3.5 16 3.5 C18.5 3.5 21 5.5 21 8.5 C21 14.5 12 21 12 21 Z" fill="#DB8A6B"/></svg></p>
</div>

<script>
  var eventDate = new Date("2026-09-20T16:00:00+05:30").getTime();

  function updateCountdown(){
    var now = new Date().getTime();
    var diff = eventDate - now;
    if(diff < 0){
      document.getElementById('countdown').innerHTML =
        '<div class="cbox" style="min-width:auto;padding:.7rem 1.2rem;"><div class="num" style="font-size:1.1rem;">🎉 It\'s party time!</div></div>';
      return;
    }
    var d = Math.floor(diff/(1000*60*60*24));
    var h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    var m = Math.floor((diff%(1000*60*60))/(1000*60));
    var s = Math.floor((diff%(1000*60))/1000);
    document.getElementById('cd-d').textContent = String(d).padStart(2,'0');
    document.getElementById('cd-h').textContent = String(h).padStart(2,'0');
    document.getElementById('cd-m').textContent = String(m).padStart(2,'0');
    document.getElementById('cd-s').textContent = String(s).padStart(2,'0');
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  // Paste the Web app URL from your Apps Script deployment here:
  var RSVP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5dea8sZSaISjOZgaKdQ0jW2Anx-au8zzB5Av3-ZmxU3ATYp068vKXmJsEJOlC_7rh/exec';

  function openRsvpForm(){
    document.getElementById('rsvp-btn').style.display = 'none';
    document.getElementById('rsvp-form').classList.add('open');
    document.getElementById('rsvp-name').focus();
  }

  function submitRsvp(){
    var nameInput = document.getElementById('rsvp-name');
    var guestsInput = document.getElementById('rsvp-guests');
    var error = document.getElementById('rsvp-error');
    var name = nameInput.value.trim();

    if(!name){
      error.style.display = 'block';
      nameInput.focus();
      return;
    }
    error.style.display = 'none';

    var guests = guestsInput.value.trim() || '1';
    var form = document.getElementById('rsvp-form');
    var msg = document.getElementById('rsvp-msg');

    if(RSVP_SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
      msg.textContent = 'RSVP form isn\'t connected yet \u2014 ask the host to finish setup.';
      return;
    }

    fetch(RSVP_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ name: name, guests: guests })
    }).catch(function(){});

    form.classList.remove('open');
    msg.textContent = 'Thanks ' + name + '! Zaad\'s family will be so happy to see you';
    burstConfetti();
  }

  var colors = ['#F4B9A0','#BFE3D0','#F3D06B','#D8C6EE','#F6C9C9'];

  function starSVG(color, size){
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24"><path d="M12 2 L14.5 9 L22 9.5 L16 14.5 L18 22 L12 17.5 L6 22 L8 14.5 L2 9.5 L9.5 9 Z" fill="'+color+'"/></svg>';
  }
  function flowerSVG(size){
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 40 40">'
      +'<circle cx="20" cy="12" r="7" fill="#F6C9C9"/><circle cx="28" cy="20" r="7" fill="#BFE3D0"/>'
      +'<circle cx="20" cy="28" r="7" fill="#D8C6EE"/><circle cx="12" cy="20" r="7" fill="#F3D06B"/>'
      +'<circle cx="20" cy="20" r="6" fill="#F4B9A0"/></svg>';
  }

  function spawnConfettiPiece(){
    var el = document.createElement('div');
    el.className = 'confetti';
    var size = 10 + Math.random()*8;
    el.style.left = Math.random()*100+'vw';
    el.style.animationDuration = (6+Math.random()*5)+'s';
    el.style.opacity = 0.55 + Math.random()*0.4;
    var kind = Math.random();
    if(kind < 0.4){
      el.innerHTML = starSVG(colors[Math.floor(Math.random()*colors.length)], size);
    } else if(kind < 0.65){
      el.innerHTML = flowerSVG(size*1.3);
    } else {
      el.style.width = size*0.6+'px';
      el.style.height = size*0.6+'px';
      el.style.borderRadius = '50%';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
    }
    document.getElementById('fx-layer').appendChild(el);
    setTimeout(function(){ el.remove(); }, 12000);
  }
  setInterval(spawnConfettiPiece, 700);
  for(var i=0;i<8;i++){ setTimeout(spawnConfettiPiece, i*300); }

  function burstConfetti(){
    for(var i=0;i<28;i++){ setTimeout(spawnConfettiPiece, i*30); }
  }

  function spawnBalloon(){
    var el = document.createElement('div');
    el.className = 'balloon';
    el.style.left = (5+Math.random()*90)+'vw';
    el.style.animationDuration = (14+Math.random()*8)+'s';
    var color = colors[Math.floor(Math.random()*colors.length)];
    el.innerHTML = '<svg width="34" height="46" viewBox="0 0 34 46"><ellipse cx="17" cy="17" rx="16" ry="19" fill="'+color+'"/><path d="M17 36 L14 42 L20 42 Z" fill="'+color+'"/><line x1="17" y1="36" x2="17" y2="46" stroke="'+color+'" stroke-width="1.5"/></svg>';
    document.getElementById('fx-layer').appendChild(el);
    setTimeout(function(){ el.remove(); }, 24000);
  }
  setInterval(spawnBalloon, 3500);
  spawnBalloon();
</script>

</body>
</html>
